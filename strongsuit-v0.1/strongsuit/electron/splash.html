<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coachwright</title>
  <style>
    /* Matches src/app/BootScreen.tsx + the Coachwright brand mark guide exactly:
       sharp wipe-build reveal, no bounce, no accent color. */
    body {
      margin: 0; padding: 0; height: 100vh; overflow: hidden;
      background: #171A1E;
      display: flex; align-items: center; justify-content: center;
      font-family: "Inter Tight", "Inter", system-ui, -apple-system, sans-serif;
      -webkit-app-region: drag;
    }
    .container {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .mark {
      display: flex; align-items: center; justify-content: center;
    }
    .mark svg { width: 56px; height: 56px; }
    .mark path {
      clip-path: inset(0 100% 0 0);
      animation: cw-wipe 0.75s cubic-bezier(0.2,0,0,1) 0.1s forwards;
    }
    .word {
      font-weight: 800; font-size: 22px; letter-spacing: -0.04em; color: #F7F6F3;
      opacity: 0; transform: translateX(-12px);
      animation: cw-word 0.5s cubic-bezier(0.2,0,0,1) 0.85s forwards;
    }
    .tagline {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: #8A919B;
      opacity: 0;
      animation: cw-fade 0.5s cubic-bezier(0.2,0,0,1) 1.25s forwards;
    }
    @keyframes cw-wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes cw-word { to { opacity: 1; transform: translateX(0); } }
    @keyframes cw-fade { to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="mark">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path d="M 86.4 29 A 42 42 0 1 0 86.4 71 L 67.3 60 A 20 20 0 1 1 67.3 40 Z" fill="#F7F6F3"/>
      </svg>
    </div>
    <div class="word">Coachwright</div>
    <div class="tagline">Coaching software you own</div>
  </div>
</body>
</html>
