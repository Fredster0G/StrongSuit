<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coachwright</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a; /* Slate 900 */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      color: white;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      animation: fadeIn 0.8s ease-out forwards;
    }

    .logo-container {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
    }

    .logo-circle {
      position: absolute;
      inset: 0;
      border: 4px solid rgba(16, 185, 129, 0.2); /* Verde */
      border-radius: 50%;
      border-top-color: #10b981;
      animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }

    .logo-inner {
      position: absolute;
      inset: 16px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 24px;
      letter-spacing: -1px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      animation: pulse 2s ease-in-out infinite;
    }

    .brand-name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .tagline {
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .progress-bar {
      margin-top: 32px;
      width: 160px;
      height: 4px;
      background-color: #1e293b;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background-color: #10b981;
      width: 30%;
      animation: load 2.5s ease-in-out infinite;
      border-radius: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.95); }
    }

    @keyframes load {
      0% { left: -30%; width: 30%; }
      50% { left: 30%; width: 70%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <div class="logo-circle"></div>
      <div class="logo-inner">C</div>
    </div>
    <h1 class="brand-name">Coachwright</h1>
    <div class="tagline">Enterprise Edition</div>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>
</body>
</html>
